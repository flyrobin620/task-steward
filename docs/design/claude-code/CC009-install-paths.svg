<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2200" viewBox="0 0 2800 2200">
<title>在 Claude Code 上安装 TaskSteward：两条各自在一处完成的路径</title>
<desc>两条安装路径进入共用安装脚本，验证后完成，验证未通过则修正后重跑。</desc>
<defs>
<marker id="arrow-main" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5 L0 10 Z" fill="#2867B3"/></marker>
<marker id="arrow-loop" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5 L0 10 Z" fill="#7857A7"/></marker>
</defs>
<rect x="0" y="0" width="2800" height="2200" fill="white"/>
<g font-family="Segoe UI, &quot;Microsoft YaHei&quot;, Arial, sans-serif">
<rect x="60" y="65" width="72" height="7" rx="3" fill="#2867B3"/>
<text x="60" y="142" font-size="44" font-weight="700" fill="#24384B" text-anchor="start">在 Claude Code 上安装 TaskSteward：两条各自在一处完成的路径</text>
<g data-boundary="Terminal path" data-box="60 230 2680 440">
<rect x="60" y="230" width="2680" height="440" rx="20" fill="#EEF4FC" stroke="#B6C7D6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="300" y="255" width="5" height="36" rx="2" fill="#2867B3"/>
<text x="330" y="282" font-size="26" font-weight="700" fill="#24384B" text-anchor="start">终端路径（全在终端）</text>
<rect x="2580" y="254" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#B6C7D6" stroke-width="2" />
<text x="2640" y="281" font-size="20" font-weight="600" fill="#24384B" text-anchor="middle">泳道</text>
</g>
<g data-boundary="Session path" data-box="60 710 2680 460">
<rect x="60" y="710" width="2680" height="460" rx="20" fill="#EEF8F1" stroke="#B6C7D6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="300" y="735" width="5" height="36" rx="2" fill="#3C8D5A"/>
<text x="330" y="762" font-size="26" font-weight="700" fill="#24384B" text-anchor="start">会话路径（全在 Claude 会话）</text>
<rect x="2580" y="734" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#B6C7D6" stroke-width="2" />
<text x="2640" y="761" font-size="20" font-weight="600" fill="#24384B" text-anchor="middle">泳道</text>
</g>
<g data-boundary="Shared installer (script)" data-box="60 1210 2680 640">
<rect x="60" y="1210" width="2680" height="640" rx="20" fill="#FFF7E8" stroke="#B6C7D6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="300" y="1235" width="5" height="36" rx="2" fill="#B5873A"/>
<text x="330" y="1262" font-size="26" font-weight="700" fill="#24384B" text-anchor="start">共用的安装脚本（由发起的那一处运行）</text>
<rect x="2580" y="1234" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#B6C7D6" stroke-width="2" />
<text x="2640" y="1261" font-size="20" font-weight="600" fill="#24384B" text-anchor="middle">泳道</text>
</g>
