<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2800" viewBox="0 0 2800 2800">
<title>在 Claude Code 上安装 TaskSteward：两条各自在一处完成的路径</title>
<desc>终端与 Claude 会话两条安装路径汇入公共安装、验证与完成流程。</desc>
<defs>
<marker id="arrow-main" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2867B3"/></marker>
<marker id="arrow-loop" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7857A7"/></marker>
</defs>
<rect x="0" y="0" width="2800" height="2800" fill="#FFFFFF"/>
<g font-family="Segoe UI, &quot;Microsoft YaHei&quot;, Arial, sans-serif">
<rect x="100" y="69" width="8" height="52" rx="4" fill="#2867B3"/>
<text x="132" y="108" font-size="44" font-weight="700" text-anchor="start" fill="#203448">在 Claude Code 上安装 TaskSteward：两条各自在一处完成的路径</text>
<g data-boundary="Terminal path" data-box="180 200 1100 900">
<rect x="180" y="200" width="1100" height="900" rx="20" fill="#EEF4FC" stroke="#B6C7D6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="204" y="227" width="5" height="33" rx="2" fill="#2867B3"/>
<text x="222" y="252" font-size="26" font-weight="700" text-anchor="start" fill="#203448">终端路径（全在终端）</text>
<text x="222" y="286" font-size="26" font-weight="700" text-anchor="start" fill="#203448"></text>
<rect x="1160" y="225" width="92" height="38" rx="19" fill="#FFFFFF" stroke="#B6C7D6" stroke-width="2" />
<text x="1206" y="251" font-size="20" font-weight="600" text-anchor="middle" fill="#203448">泳道</text>
</g>
<g data-boundary="Session path" data-box="1520 200 1100 1100">
<rect x="1520" y="200" width="1100" height="1100" rx="20" fill="#EEF8F1" stroke="#B6C7D6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="1544" y="227" width="5" height="33" rx="2" fill="#2867B3"/>
<text x="1562" y="252" font-size="26" font-weight="700" text-anchor="start" fill="#203448">会话路径（全在 Claude 会话）</text>
<text x="1562" y="286" font-size="26" font-weight="700" text-anchor="start" fill="#203448"></text>
<rect x="2500" y="225" width="92" height="38" rx="19" fill="#FFFFFF" stroke="#B6C7D6" stroke-width="2" />
<text x="2546" y="251" font-size="20" font-weight="600" text-anchor="middle" fill="#203448">泳道</text>
</g>
<g data-boundary="Shared installer" data-box="180 1370 2440 1200">
<rect x="180" y="1370" width="2440" height="1200" rx="20" fill="#FFF7E8" stroke="#B6C7D6" stroke-width="2" stroke-dasharray="9 8"/>
<rect x="204" y="1397" width="5" height="33" rx="2" fill="#2867B3"/>
<text x="222" y="1422" font-size="26" font-weight="700" text-anchor="start" fill="#203448">公共流程（同一个安装脚本，</text>
<text x="222" y="1456" font-size="26" font-weight="700" text-anchor="start" fill="#203448">在发起的那一处运行）</text>
<rect x="2500" y="1395" width="92" height="38" rx="19" fill="#FFFFFF" stroke="#B6C7D6" stroke-width="2" />
<text x="2546" y="1421" font-size="20" font-weight="600" text-anchor="middle" fill="#203448">泳道</text>
</g>
<path d="M 730 390 V 465" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>
