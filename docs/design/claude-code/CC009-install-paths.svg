<g data-node="Start in a terminal" data-kind="start" data-box="330 350 430 120">
<rect x="330" y="350" width="430" height="120" rx="60.0" fill="#EAF6EE" stroke="#3C8D5A" stroke-width="2" />
<text x="545.0" y="418.16" font-size="24" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="545.0" y="418.16">开始（终端）</tspan></text>
</g>
<g data-node="git clone the product repository" data-kind="step" data-box="940 330 550 160">
<rect x="940" y="330" width="550" height="160" rx="12" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" />
<text x="1215.0" y="419.52" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="419.52">git clone 产品仓库</tspan></text>
</g>
<g data-node="Run setup.ps1" data-kind="step" data-box="1730 300 720 220">
<rect x="1730" y="300" width="720" height="220" rx="12" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" />
<text x="2090.0" y="379.0" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="2090.0" y="379.0">运行 setup.ps1</tspan></text>
<text x="2090.0" y="435.0" font-size="21" font-weight="400" fill="#506174" text-anchor="middle" xml:space="preserve"><tspan x="2090.0" y="435.0">探测 Python、git 与 claude，在终端中提问</tspan><tspan x="2090.0" y="466.0"></tspan></text>
</g>
<g data-node="Start in a Claude session" data-kind="start" data-box="330 870 430 120">
<rect x="330" y="870" width="430" height="120" rx="60.0" fill="#EAF6EE" stroke="#3C8D5A" stroke-width="2" />
<text x="545.0" y="938.16" font-size="24" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="545.0" y="938.16">开始（Claude 会话）</tspan></text>
</g>
<g data-node="/plugin install task-steward" data-kind="step" data-box="940 820 550 220">
<rect x="940" y="820" width="550" height="220" rx="12" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" />
<text x="1215.0" y="899.0" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="899.0">/plugin install task-steward</tspan></text>
<text x="1215.0" y="955.0" font-size="21" font-weight="400" fill="#506174" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="955.0">从 GitHub 插件市场，</tspan><tspan x="1215.0" y="986.0">再 /reload-plugins</tspan></text>
</g>
<g data-node="/task-steward:setup" data-kind="step" data-box="1730 820 720 220">
<rect x="1730" y="820" width="720" height="220" rx="12" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" />
<text x="2090.0" y="899.0" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="2090.0" y="899.0">/task-steward:setup</tspan></text>
<text x="2090.0" y="955.0" font-size="21" font-weight="400" fill="#506174" text-anchor="middle" xml:space="preserve"><tspan x="2090.0" y="955.0">探测前提、克隆检出，在会话中提问</tspan><tspan x="2090.0" y="986.0"></tspan></text>
</g>
<g data-node="tsw setup install" data-kind="subprocess" data-box="330 1380 570 370">
<rect x="330" y="1380" width="570" height="370" rx="2" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" /><line x1="342" y1="1380" x2="342" y2="1750" stroke="#2867B3" stroke-width="2"/><line x1="888" y1="1380" x2="888" y2="1750" stroke="#2867B3" stroke-width="2"/>
<text x="615.0" y="1487.5" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="1487.5">tsw setup install</tspan></text>
<text x="615.0" y="1543.5" font-size="21" font-weight="400" fill="#506174" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="1543.5">同一套确定步骤：PATH 垫片、</tspan><tspan x="615.0" y="1574.5">市场改指检出、数据目录与配置、</tspan><tspan x="615.0" y="1605.5">用户设置（先备份）、</tspan><tspan x="615.0" y="1636.5">host render、Dashboard</tspan><tspan x="615.0" y="1667.5"></tspan></text>
</g>
<g data-node="tsw setup verify" data-kind="subprocess" data-box="1030 1505 350 120">
<rect x="1030" y="1505" width="350" height="120" rx="2" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" /><line x1="1042" y1="1505" x2="1042" y2="1625" stroke="#2867B3" stroke-width="2"/><line x1="1368" y1="1505" x2="1368" y2="1625" stroke="#2867B3" stroke-width="2"/>
<text x="1205.0" y="1574.52" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="1205.0" y="1574.52">tsw setup verify</tspan></text>
</g>
<g data-node="Verified?" data-kind="decision" data-box="1490 1455 220 220">
<polygon points="1600.0,1455 1710,1565.0 1600.0,1675 1490,1565.0" fill="#FFF7E8" stroke="#B5873A" stroke-width="2"/>
<text x="1600.0" y="1573.16" font-size="24" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="1600.0" y="1573.16">验证通过？</tspan></text>
</g>
<g data-node="Restart Claude app, open the main session in the data directory" data-kind="step" data-box="1910 1465 540 200">
<rect x="1910" y="1465" width="540" height="200" rx="12" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" />
<text x="2180.0" y="1538.52" font-size="28" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="2180.0" y="1538.52">重启 Claude app，</tspan><tspan x="2180.0" y="1574.52">在数据目录打开主会话</tspan><tspan x="2180.0" y="1610.52"></tspan></text>
</g>
<g data-node="Done" data-kind="end" data-box="2560 1520 130 90">
<rect x="2560" y="1520" width="130" height="90" rx="45.0" fill="#F0F3F6" stroke="#708294" stroke-width="2" />
<text x="2625.0" y="1573.16" font-size="24" font-weight="600" fill="#24384B" text-anchor="middle" xml:space="preserve"><tspan x="2625.0" y="1573.16">完成</tspan></text>
</g>
<g data-badge="9" data-box="1035 1313 250 34">
<rect x="1035" y="1313" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#7857A7" stroke-width="2" />
<text x="1160.0" y="1337" font-size="20" font-weight="600" fill="#7857A7" text-anchor="middle">否：修正后重跑</text>
</g>
<g data-badge="10" data-box="1760 1548 100 34">
<rect x="1760" y="1548" width="100" height="34" rx="17" fill="#FFFFFF" stroke="#2867B3" stroke-width="2" />
<text x="1810.0" y="1572" font-size="20" font-weight="600" fill="#2867B3" text-anchor="middle">是</text>
</g>
