<rect x="750" y="2680" width="70" height="42" rx="2" fill="#EAF3FF" stroke="#2867B3" stroke-width="2" /><line x1="762" y1="2680" x2="762" y2="2722" stroke="#2867B3" stroke-width="2"/><line x1="808" y1="2680" x2="808" y2="2722" stroke="#2867B3" stroke-width="2"/>
<text x="838" y="2709" font-size="20" font-weight="400" text-anchor="start" fill="#203448">子流程</text>
<polygon points="1155.0,2680 1190,2701.0 1155.0,2722 1120,2701.0" fill="#FFF7E8" stroke="#B5873A" stroke-width="2"/>
<text x="1208" y="2709" font-size="20" font-weight="400" text-anchor="start" fill="#203448">判断</text>
<rect x="1450" y="2680" width="70" height="42" rx="21.0" fill="#F0F3F6" stroke="#708294" stroke-width="2" />
<text x="1538" y="2709" font-size="20" font-weight="400" text-anchor="start" fill="#203448">结束</text>
<path d="M 1750 2701 H 1824" fill="none" stroke="#2867B3" stroke-width="3" marker-end="url(#arrow-main)"/>
<text x="1842" y="2709" font-size="20" font-weight="400" text-anchor="start" fill="#203448">主路径</text>
<path d="M 2180 2701 H 2254" fill="none" stroke="#7857A7" stroke-width="3" marker-end="url(#arrow-loop)"/>
<text x="2272" y="2709" font-size="20" font-weight="400" text-anchor="start" fill="#203448">重试与循环</text>
</g>
